<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 学习助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root {
            --font-body: "IBM Plex Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-pixel: "Press Start 2P", "IBM Plex Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --bg-1: #f5f6f2;
            --bg-2: #edf1ea;
            --surface: #ffffff;
            --surface-strong: #f8faf5;
            --border: #cfd6c7;
            --text: #1f2a1f;
            --muted: #5d6a5c;
            --accent: #5c7a52;
            --accent-2: #7c9cff;
            --accent-3: #6f8f6a;
            --ok: #5b7f53;
            --shadow: none;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            color: var(--text);
            font-family: var(--font-body);
            background:
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            overflow-x: hidden;
        }

        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.04;
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 28px 16px 36px;
        }

        .hero {
            max-width: 1180px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 18px;
            align-items: stretch;
        }

        .panel {
            background: var(--surface);
            border: 3px solid var(--border);
            border-radius: 0;
            box-shadow: var(--shadow);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background-image:
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .intro {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            min-height: 620px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .nexus-logo {
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border: 3px solid var(--border);
            border-radius: 0;
            background: #f7faf4;
            display: grid;
            place-items: center;
            image-rendering: pixelated;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.08);
        }

        .nexus-logo svg {
            width: 48px;
            height: 48px;
            display: block;
        }

        .brand-copy {
            min-width: 0;
        }

        .intro::before,
        .intro::after {
            content: "";
            position: absolute;
            border-radius: 0;
            opacity: 0.35;
        }

        .intro::before {
            width: 84px;
            height: 84px;
            right: 16px;
            top: 16px;
            background:
                linear-gradient(90deg, transparent 48%, rgba(92,122,82,0.15) 48%, rgba(92,122,82,0.15) 52%, transparent 52%),
                linear-gradient(transparent 48%, rgba(92,122,82,0.15) 48%, rgba(92,122,82,0.15) 52%, transparent 52%);
            background-size: 12px 12px;
        }

        .intro::after {
            width: 72px;
            height: 72px;
            left: 18px;
            bottom: 18px;
            background:
                linear-gradient(90deg, transparent 48%, rgba(111,143,106,0.14) 48%, rgba(111,143,106,0.14) 52%, transparent 52%),
                linear-gradient(transparent 48%, rgba(111,143,106,0.14) 48%, rgba(111,143,106,0.14) 52%, transparent 52%);
            background-size: 12px 12px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            width: fit-content;
            border: 3px solid var(--border);
            border-radius: 0;
            background: #f4f6f1;
            color: var(--accent);
            font-size: 13px;
            letter-spacing: 0.4px;
            font-family: var(--font-pixel);
            line-height: 1.6;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.04);
        }

        .eyebrow-dot {
            width: 8px;
            height: 8px;
            border-radius: 1px;
            background: var(--ok);
            box-shadow: none;
        }

        .pixel {
            font-family: var(--font-pixel);
            letter-spacing: 0;
            line-height: 1.35;
        }

        .title {
            margin-top: 22px;
            font-size: clamp(34px, 4vw, 58px);
            line-height: 1.08;
            letter-spacing: -0.02em;
            font-weight: 600;
        }

        .title span {
            color: var(--accent);
            background: none;
            -webkit-background-clip: initial;
            background-clip: initial;
            font-family: var(--font-pixel);
            display: inline-block;
            margin-top: 6px;
        }

        .desc {
            margin-top: 18px;
            max-width: 54ch;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .metric-row {
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .metric {
            padding: 16px 16px 15px;
            border-radius: 0;
            background: #fafbf8;
            border: 3px solid var(--border);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.05);
        }

        .metric-value {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            font-family: var(--font-pixel);
            line-height: 1.45;
        }

        .metric-label {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .feature-grid {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .feature {
            padding: 16px;
            border-radius: 0;
            background: #fafbf8;
            border: 3px solid var(--border);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.05);
            min-height: 96px;
        }

        .feature h4 {
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-pixel);
        }

        .feature p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .footer-note {
            margin-top: 24px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        .qa {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 620px;
        }

        .qa-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 4px 4px 12px;
        }

        .qa-head h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            font-family: var(--font-pixel);
        }

        .qa-head .badge {
            padding: 10px 12px;
            border-radius: 0;
            background: #f4f6f1;
            color: var(--accent);
            border: 3px solid var(--border);
            font-weight: 500;
            font-family: var(--font-pixel);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.04);
        }

        .question-box {
            padding: 18px;
            border-radius: 0;
            background: var(--surface-strong);
            border: 3px solid var(--border);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.05);
        }

        .question-box label {
            margin-bottom: 10px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-pixel);
        }

        .question-input {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            border: 3px solid var(--border);
            border-radius: 0;
            padding: 14px 16px;
            background: #fff;
            color: var(--text);
            outline: none;
            font-size: 15px;
            line-height: 1.7;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
            font-family: var(--font-body);
        }

        .question-input::placeholder { color: #8b968a; }

        .question-input:focus {
            border-color: var(--accent);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .actions {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .submit-btn {
            border: none;
            border-radius: 0;
            padding: 12px 18px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.08);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
            font-family: var(--font-pixel);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            background: #4f6948;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.08);
        }

        .submit-btn:disabled {
            cursor: not-allowed;
            opacity: 0.72;
            transform: none;
            box-shadow: none;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            border: 3px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: 0;
            padding: 9px 13px;
            font-size: 13px;
            transition: all .18s ease;
            font-family: var(--font-pixel);
        }

        .chip:hover {
            border-color: var(--accent);
            background: #f0f5eb;
            color: var(--text);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.05);
        }

        .response-card {
            min-height: 250px;
            padding: 18px;
            border-radius: 0;
            background: #fff;
            border: 3px solid var(--border);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.05);
        }

        .response-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .response-title h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--font-pixel);
        }

        .response-meta {
            font-size: 12px;
            color: var(--muted);
        }

        .response-body {
            white-space: pre-wrap;
            line-height: 1.9;
            color: var(--text);
            font-size: 15px;
            min-height: 170px;
        }

        .response-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 170px;
            color: var(--muted);
            text-align: center;
            padding: 0 16px;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            font-size: 13px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border-radius: 0;
            border: 2px solid #d6ddd1;
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pulse { animation: none; }

        @media (max-width: 991px) {
            .hero { grid-template-columns: 1fr; }
            .intro, .qa { min-height: auto; }
        }

        @media (max-width: 575px) {
            .wrap { padding: 14px 10px 20px; }
            .intro, .qa { padding: 18px; border-radius: 0; }
            .metric-row, .feature-grid { grid-template-columns: 1fr; }
            .qa-head { flex-direction: column; align-items: flex-start; }
            .question-input { min-height: 140px; }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <main class="wrap">
        <section class="hero">
            <div class="panel intro pulse">
                <div>
                    <div class="brand-row">
                        <div class="nexus-logo" aria-hidden="true">
                            <svg viewBox="0 0 32 32" role="img" aria-label="Nexus logo">
                                <rect x="4" y="4" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="8" y="4" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="4" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="20" y="4" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="4" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="4" y="8" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="8" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="20" y="8" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="8" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="4" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="8" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="16" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="20" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="12" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="4" y="16" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="16" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="20" y="16" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="16" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="4" y="20" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="20" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="20" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="4" y="24" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="8" y="24" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="12" y="24" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="16" y="24" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="20" y="24" width="4" height="4" fill="#5c7a52"></rect>
                                <rect x="24" y="24" width="4" height="4" fill="#5c7a52"></rect>
                            </svg>
                        </div>
                        <div class="brand-copy">
                            <div class="eyebrow"><span class="eyebrow-dot"></span> Nexus · 个人学习助手</div>
                        </div>
                    </div>
                    <h1 class="title">Nexus·面向ZJUT学生的<br><span class="pixel">课程学习资料问答入口</span></h1>
                    <p class="desc">
                        你可以把课程资料、整理后的学习材料放进数据库，系统会先检索，再生成回答。
                    </p>

                    <div class="metric-row">
                        <div class="metric">
                            <div class="metric-value">检索 + 生成</div>
                            <div class="metric-label">先查数据库，再结合上下文回答。</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">实时反馈</div>
                            <div class="metric-label">等待、错误、结果都清楚可见。</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">学生可用</div>
                            <div class="metric-label">适合课程资料检索和快速复习。</div>
                        </div>
                    </div>

                    <div class="feature-grid">
                        <div class="feature">
                            <h4>更少干扰</h4>
                            <p>保留必要信息，降低视觉噪音，让使用者更快进入提问。</p>
                        </div>
                        <div class="feature">
                            <h4>便于扩展</h4>
                            <p>后续可以继续加入资料来源、历史记录和标签检索。</p>
                        </div>
                    </div>
                </div>

                <div class="footer-note">Nexus · 个人学习助手</div>
            </div>

            <div class="panel qa">
                <div class="qa-head">
                    <h2>提问</h2>
                    <span class="badge">Nexus</span>
                </div>

                <div class="question-box">
                    <label for="question">请输入问题</label>
                    <textarea class="question-input" id="question" placeholder="例如：这门课的重点是什么？某个知识点怎么理解？" required></textarea>

                    <div class="actions">
                        <button type="button" class="submit-btn" id="submit-btn">提交问题</button>
                        <div class="loading" id="loading">
                            <span class="spinner"></span>
                            <span>正在检索资料并生成回答...</span>
                        </div>
                    </div>

                    <div class="hint mt-2">支持中文提问，也可以直接点下面的快捷问题。</div>
                    <div class="chips mt-3">
                        <button type="button" class="chip" data-question="这门课的重点内容是什么？">课程重点</button>
                        <button type="button" class="chip" data-question="这个知识点怎么理解？">知识点解释</button>
                        <button type="button" class="chip" data-question="请给我一个简短总结。">简短总结</button>
                        <button type="button" class="chip" data-question="这份资料适合怎么复习？">复习建议</button>
                    </div>
                </div>

                <div class="response-card">
                    <div class="response-title">
                        <h3>回答</h3>
                        <div class="response-meta" id="response-meta">等待输入</div>
                    </div>
                    <div id="response" class="response-empty">答案会显示在这里。</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const formState = {
            submitting: false
        };

        const questionInput = document.getElementById('question');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const responseBox = document.getElementById('response');
        const responseMeta = document.getElementById('response-meta');

        function setLoading(isLoading) {
            formState.submitting = isLoading;
            submitBtn.disabled = isLoading;
            loading.style.display = isLoading ? 'inline-flex' : 'none';
            submitBtn.textContent = isLoading ? '生成中...' : '提交问题';
        }

        function renderResponse(content, meta = '已返回结果') {
            responseMeta.textContent = meta;
            responseBox.classList.remove('response-empty');
            responseBox.classList.add('response-body');
            responseBox.textContent = content;
        }

        async function askQuestion(question) {
            const trimmed = (question || '').trim();
            if (!trimmed) {
                renderResponse('请输入一个问题后再提交。', '提示');
                return;
            }

            setLoading(true);
            responseMeta.textContent = '请求处理中';
            responseBox.classList.remove('response-empty');
            responseBox.classList.add('response-body');
            responseBox.textContent = '正在检索相关内容并生成回答，请稍候...';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8'
                    },
                    body: JSON.stringify({ question: trimmed })
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const result = data.response || data.answer || '未收到有效回复';
                renderResponse(result, 'AI 已返回');
            } catch (error) {
                console.error('Error:', error);
                renderResponse(`出现错误：${error.message}`, '请求失败');
            } finally {
                setLoading(false);
            }
        }

        document.getElementById('submit-btn').addEventListener('click', () => {
            askQuestion(questionInput.value);
        });

        questionInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                askQuestion(questionInput.value);
            }
        });

        document.querySelectorAll('.chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                questionInput.value = chip.dataset.question || '';
                questionInput.focus();
            });
        });
    </script>
</body>
</html>
